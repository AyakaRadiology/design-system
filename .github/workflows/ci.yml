name: CI

# One job, because every check here is fast and they share one install. The
# order is deliberate: rebuild dist/ and diff it first, so a stale artifact
# fails before the suites get a chance to pass against a build nobody
# committed.
#
# runs-on: GitHub-hosted ubuntu-latest. This repository is PUBLIC, so hosted
# minutes are free here, and the org's self-hosted runner group refuses public
# repositories anyway (allows_public_repositories: false) — a self-hosted job
# would queue forever. It is also the safer half of the trade: a fork PR
# against a public repository must never get to execute on the workstation
# that hosts those runners.

on:
    push:
        branches: ['main']
        tags: ['v*']
    pull_request:
        branches: ['**']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Only superseded PR pushes are cancelled; a main push or v* tag run is
    # the record for that commit and must always finish.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Quality Check
        runs-on: ubuntu-latest
        # Measured: runs take ~65 s (p95 well under 2 min); 10 min is a hang guard.
        timeout-minutes: 10
        steps:
            # Deliberately no path filter anywhere in this workflow. "Quality
            # Check" is the merge gate, and a filtered-out pull request never
            # starts the workflow at all, so the context never reports and the
            # PR stays blocked with no way to satisfy it.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Every `uses:` must be a full commit SHA with a version comment (Dependabot reads it).
            - uses: Lin214ia/workflows/.github/actions/check-pins@99dfe7b57cff656c0ff42c69cbf5d4e06a2dd293 # v1.1.0

            # Node AND bun, because they do different jobs here and neither
            # substitutes for the other: bun installs and runs the suites,
            # while `node` is what a consumer uses to load `bin/design-lint.js`
            # out of the committed dist/, so the consumer smoke test needs a
            # real one. Both are pinned rather than taken from whatever the
            # runner image happens to preinstall, because this job rebuilds the
            # committed dist/ and diffs it.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.4.2'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # `bun run check` installs Chromium into node_modules/.cache/ms-playwright
            # (tests/consumer/run.sh, tools/storybook-smoke.ts). Cache that exact
            # directory, keyed on the locked Playwright version. Restored AFTER
            # bun install, which leaves node_modules/.cache alone. Both scripts
            # still run `playwright install` every time: a no-op on a full hit,
            # and it repairs a partial cache.
            - name: Resolve locked Playwright version
              id: playwright
              run: echo "version=$(grep -oP '"playwright@\K[0-9][^"]*' bun.lock | head -n1)" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            - name: Check
              run: bun run check
